# OpenTelemetry Collector (fase OSS, semanas 1-6): recebe traces OTLP.
# Na semana 7 este arquivo e substituido por apps-optional/otel-collector-datadog.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.173.1
    helm:
      releaseName: otel-collector
      values: |
        image:
          repository: otel/opentelemetry-collector-contrib
          tag: 0.160.0
        mode: deployment
        replicaCount: 1
        rewriteDeprecatedComponentNames: false
        presets:
          kubernetesAttributes:
            enabled: true
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          metrics:
            enabled: false
          prometheus:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            memory_limiter:
              check_interval: 1s
              limit_mib: 300
              spike_limit_mib: 80
            batch:
              send_batch_size: 1024
              timeout: 10s
            resource:
              attributes:
              - key: deployment.environment
                value: prod
                action: upsert
              - key: k8s.cluster.name
                value: solidarytech-eks
                action: upsert
          connectors:
            spanmetrics:
              histogram:
                explicit:
                  buckets:
                  - 10ms
                  - 50ms
                  - 100ms
                  - 300ms
                  - 500ms
                  - 1s
                  - 2s
              dimensions:
              - name: http.response.status_code
          exporters:
            prometheus:
              endpoint: 0.0.0.0:8889
              resource_to_telemetry_conversion:
                enabled: true
            debug:
              verbosity: basic
          service:
            pipelines:
              traces:
                receivers:
                - otlp
                processors:
                - memory_limiter
                - k8sattributes
                - resource
                - batch
                exporters:
                - debug
                - spanmetrics
              metrics:
                receivers:
                - otlp
                - spanmetrics
                processors:
                - memory_limiter
                - k8sattributes
                - resource
                - batch
                exporters:
                - prometheus
              logs:
                receivers:
                - otlp
                processors:
                - memory_limiter
                - batch
                exporters:
                - debug
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /status/terminatingReplicas
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
