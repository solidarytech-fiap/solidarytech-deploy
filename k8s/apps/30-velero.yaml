# Velero: backup do estado do cluster para S3 em us-west-2 (DR Opcao A).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 8.0.0
    helm:
      releaseName: velero
      values: |
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.11.0
            volumeMounts:
              - mountPath: /target
                name: plugins
        # CRDs aplicadas pelo ArgoCD a partir do chart (sem job de kubectl).
        upgradeCRDs: false
        cleanUpCRDs: false
        # Sem volumes persistentes nos workloads (dados ficam em RDS/DynamoDB).
        snapshotsEnabled: false
        deployNodeAgent: false
        # AWS Academy: sem IRSA. Usa a credencial do node (LabRole via IMDSv2).
        credentials:
          useSecret: false
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: solidarytech-dr-backups-211125582187
              prefix: velero
              default: true
              config:
                region: us-west-2
          volumeSnapshotLocation: []
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 512Mi }
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/status/terminatingReplicas]
    - group: apps
      kind: StatefulSet
      jsonPointers: [/status/terminatingReplicas]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    # Retry resolve a ordem de CRDs entre Applications (ex.: ServiceMonitor
    # criado antes do kube-prometheus-stack instalar a CRD).
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
