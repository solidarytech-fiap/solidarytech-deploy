# SSM Parameter Store como fonte de segredos para todo o cluster.
# Sem bloco "auth": o operador usa a cadeia padrao de credenciais da AWS,
# que no AWS Academy e a LabRole do node (IMDSv2, hop limit 2).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
