apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target: { name: datadog-secret }
  data:
    - { secretKey: api-key, remoteRef: { key: /solidarytech/prod/datadog/api-key } }
    - { secretKey: site, remoteRef: { key: /solidarytech/prod/datadog/site } }
