            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (container) (increase(kube_pod_container_status_restarts_total{namespace=\"solidarytech\"}[15m]))",
              "legendFormat": "{{container}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ],
      "annotations": {
        "list": []
      }
    }
