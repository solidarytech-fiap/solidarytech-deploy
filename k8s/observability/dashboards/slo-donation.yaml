            "mode": "markdown",
            "content": "## donation-service - SLOs (janela de 30 dias)\n| SLI | Definicao | SLO | Error budget |\n|---|---|---|---|\n| **Disponibilidade** | requisicoes em `/donations` sem 5xx / total | **99,9%** | 0,1% (~43 min/mes) |\n| **Latencia** | requisicoes em `/donations` com resposta < 300 ms / total | **95%** | 5% das requisicoes |\nAlertas: multi-burn-rate (14,4x/1h, 6x/6h -> page; 3x/1d, 1x/3d -> ticket). Definicao formal: `docs/sre.md`."
