# SLOs do donation-service (caminho critico). Definicao formal: docs/sre.md
#   SLI 1 Disponibilidade: % de requisicoes em /donations sem resposta 5xx   -> SLO 99,9% / 30d
#   SLI 2 Latencia       : % de requisicoes em /donations respondidas < 300ms -> SLO 95%   / 30d
# Alertas: multiwindow, multi-burn-rate (Google SRE Workbook, cap. 5).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-donation-service
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: slo-donation-recording
      interval: 30s
      rules:
      - record: slo:donation_availability:error_ratio_rate5m
        expr: |
          (
            sum(rate(http_requests_total{service="donation-service",route="/donations",code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{service="donation-service",route="/donations"}[5m])), 1e-9)
          ) or vector(0)
      - record: slo:donation_availability:error_ratio_rate30m
        expr: |
          (
            sum(rate(http_requests_total{service="donation-service",route="/donations",code=~"5.."}[30m]))
            /
            clamp_min(sum(rate(http_requests_total{service="donation-service",route="/donations"}[30m])), 1e-9)
          ) or vector(0)
      - record: slo:donation_availability:error_ratio_rate1h
        expr: |
          (
            sum(rate(http_requests_total{service="donation-service",route="/donations",code=~"5.."}[1h]))
            /
            clamp_min(sum(rate(http_requests_total{service="donation-service",route="/donations"}[1h])), 1e-9)
          ) or vector(0)
      - record: slo:donation_availability:error_ratio_rate2h
        expr: |
          (
            sum(rate(http_requests_total{service="donation-service",route="/donations",code=~"5.."}[2h]))
            /
            clamp_min(sum(rate(http_requests_total{service="donation-service",route="/donations"}[2h])), 1e-9)
          ) or vector(0)
      - record: slo:donation_availability:error_ratio_rate6h
        expr: |
          (
            sum(rate(http_requests_total{service="donation-service",route="/donations",code=~"5.."}[6h]))
            /
            clamp_min(sum(rate(http_requests_total{service="donation-service",route="/donations"}[6h])), 1e-9)
          ) or vector(0)
      - record: slo:donation_availability:error_ratio_rate1d
        expr: |
          (
            sum(rate(http_requests_total{service="donation-service",route="/donations",code=~"5.."}[1d]))
            /
            clamp_min(sum(rate(http_requests_total{service="donation-service",route="/donations"}[1d])), 1e-9)
          ) or vector(0)
      - record: slo:donation_availability:error_ratio_rate3d
        expr: |
          (
            sum(rate(http_requests_total{service="donation-service",route="/donations",code=~"5.."}[3d]))
            /
            clamp_min(sum(rate(http_requests_total{service="donation-service",route="/donations"}[3d])), 1e-9)
          ) or vector(0)
      - record: slo:donation_availability:error_ratio_rate30d
        expr: |
          (
            sum(rate(http_requests_total{service="donation-service",route="/donations",code=~"5.."}[30d]))
            /
            clamp_min(sum(rate(http_requests_total{service="donation-service",route="/donations"}[30d])), 1e-9)
          ) or vector(0)
      - record: slo:donation_latency:error_ratio_rate5m
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{service="donation-service",route="/donations",le="0.3"}[5m]))
              /
              clamp_min(sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[5m])), 1e-9)
            )
          ) and sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[5m])) > 0 or vector(0)
      - record: slo:donation_latency:error_ratio_rate30m
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{service="donation-service",route="/donations",le="0.3"}[30m]))
              /
              clamp_min(sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[30m])), 1e-9)
            )
          ) and sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[30m])) > 0 or vector(0)
      - record: slo:donation_latency:error_ratio_rate1h
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{service="donation-service",route="/donations",le="0.3"}[1h]))
              /
              clamp_min(sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[1h])), 1e-9)
            )
          ) and sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[1h])) > 0 or vector(0)
      - record: slo:donation_latency:error_ratio_rate2h
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{service="donation-service",route="/donations",le="0.3"}[2h]))
              /
              clamp_min(sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[2h])), 1e-9)
            )
          ) and sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[2h])) > 0 or vector(0)
      - record: slo:donation_latency:error_ratio_rate6h
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{service="donation-service",route="/donations",le="0.3"}[6h]))
              /
              clamp_min(sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[6h])), 1e-9)
            )
          ) and sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[6h])) > 0 or vector(0)
      - record: slo:donation_latency:error_ratio_rate1d
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{service="donation-service",route="/donations",le="0.3"}[1d]))
              /
              clamp_min(sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[1d])), 1e-9)
            )
          ) and sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[1d])) > 0 or vector(0)
      - record: slo:donation_latency:error_ratio_rate3d
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{service="donation-service",route="/donations",le="0.3"}[3d]))
              /
              clamp_min(sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[3d])), 1e-9)
            )
          ) and sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[3d])) > 0 or vector(0)
      - record: slo:donation_latency:error_ratio_rate30d
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{service="donation-service",route="/donations",le="0.3"}[30d]))
              /
              clamp_min(sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[30d])), 1e-9)
            )
          ) and sum(rate(http_request_duration_seconds_count{service="donation-service",route="/donations"}[30d])) > 0 or vector(0)
      - record: slo:donation_availability:objective
        expr: vector(0.999)
      - record: slo:donation_latency:objective
        expr: vector(0.95)
      # Error budget restante (1 = 100% disponivel, <0 = SLO violado)
      - record: slo:donation_availability:error_budget_remaining
        expr: 1 - (slo:donation_availability:error_ratio_rate30d / (1 - 0.999))
      - record: slo:donation_latency:error_budget_remaining
        expr: 1 - (slo:donation_latency:error_ratio_rate30d / (1 - 0.95))
      # Burn rate (1 = consumindo o budget exatamente no ritmo do mes)
      - record: slo:donation_availability:burn_rate1h
        expr: slo:donation_availability:error_ratio_rate1h / (1 - 0.999)
      - record: slo:donation_availability:burn_rate6h
        expr: slo:donation_availability:error_ratio_rate6h / (1 - 0.999)
      - record: slo:donation_latency:burn_rate1h
        expr: slo:donation_latency:error_ratio_rate1h / (1 - 0.95)
      - record: slo:donation_latency:burn_rate6h
        expr: slo:donation_latency:error_ratio_rate6h / (1 - 0.95)
    - name: slo-donation-alerts
      rules:
      - alert: DonationSLOAvailabilityBurnRate1h
        expr: |
          slo:donation_availability:error_ratio_rate1h > 0.0144
          and
          slo:donation_availability:error_ratio_rate5m > 0.0144
        for: 2m
        labels:
          severity: critical
          service: donation-service
          slo: availability
        annotations:
          summary: "donation-service queimando error budget de availability (14.4x)"
          description: "2% do error budget mensal consumido em 1h. Burn rate 14.4x sobre SLO 99.9%. Ratio 1h: {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/solidarytech-fiap/solidarytech-app/blob/main/docs/runbooks/donation-slo-burn.md
      - alert: DonationSLOAvailabilityBurnRate6h
        expr: |
          slo:donation_availability:error_ratio_rate6h > 0.006
          and
          slo:donation_availability:error_ratio_rate30m > 0.006
        for: 15m
        labels:
          severity: critical
          service: donation-service
          slo: availability
        annotations:
          summary: "donation-service queimando error budget de availability (6x)"
          description: "5% do error budget mensal consumido em 6h. Burn rate 6x sobre SLO 99.9%. Ratio 6h: {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/solidarytech-fiap/solidarytech-app/blob/main/docs/runbooks/donation-slo-burn.md
      - alert: DonationSLOAvailabilityBurnRate1d
        expr: |
          slo:donation_availability:error_ratio_rate1d > 0.003
          and
          slo:donation_availability:error_ratio_rate2h > 0.003
        for: 1h
        labels:
          severity: warning
          service: donation-service
          slo: availability
        annotations:
          summary: "donation-service queimando error budget de availability (3x)"
          description: "10% do error budget mensal consumido em 1 dia. Burn rate 3x sobre SLO 99.9%. Ratio 1d: {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/solidarytech-fiap/solidarytech-app/blob/main/docs/runbooks/donation-slo-burn.md
      - alert: DonationSLOAvailabilityBurnRate3d
        expr: |
          slo:donation_availability:error_ratio_rate3d > 0.001
          and
          slo:donation_availability:error_ratio_rate6h > 0.001
        for: 3h
        labels:
          severity: warning
          service: donation-service
          slo: availability
        annotations:
          summary: "donation-service queimando error budget de availability (1x)"
          description: "10% do error budget mensal consumido em 3 dias. Burn rate 1x sobre SLO 99.9%. Ratio 3d: {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/solidarytech-fiap/solidarytech-app/blob/main/docs/runbooks/donation-slo-burn.md
      - alert: DonationSLOLatencyBurnRate1h
        expr: |
          slo:donation_latency:error_ratio_rate1h > 0.72
          and
          slo:donation_latency:error_ratio_rate5m > 0.72
        for: 2m
        labels:
          severity: critical
          service: donation-service
          slo: latency
        annotations:
          summary: "donation-service queimando error budget de latency (14.4x)"
          description: "2% do error budget mensal consumido em 1h. Burn rate 14.4x sobre SLO 95%. Ratio 1h: {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/solidarytech-fiap/solidarytech-app/blob/main/docs/runbooks/donation-slo-burn.md
      - alert: DonationSLOLatencyBurnRate6h
        expr: |
          slo:donation_latency:error_ratio_rate6h > 0.3
          and
          slo:donation_latency:error_ratio_rate30m > 0.3
        for: 15m
        labels:
          severity: critical
          service: donation-service
          slo: latency
        annotations:
          summary: "donation-service queimando error budget de latency (6x)"
          description: "5% do error budget mensal consumido em 6h. Burn rate 6x sobre SLO 95%. Ratio 6h: {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/solidarytech-fiap/solidarytech-app/blob/main/docs/runbooks/donation-slo-burn.md
      - alert: DonationSLOLatencyBurnRate1d
        expr: |
          slo:donation_latency:error_ratio_rate1d > 0.15
          and
          slo:donation_latency:error_ratio_rate2h > 0.15
        for: 1h
        labels:
          severity: warning
          service: donation-service
          slo: latency
        annotations:
          summary: "donation-service queimando error budget de latency (3x)"
          description: "10% do error budget mensal consumido em 1 dia. Burn rate 3x sobre SLO 95%. Ratio 1d: {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/solidarytech-fiap/solidarytech-app/blob/main/docs/runbooks/donation-slo-burn.md
      - alert: DonationSLOLatencyBurnRate3d
        expr: |
          slo:donation_latency:error_ratio_rate3d > 0.05
          and
          slo:donation_latency:error_ratio_rate6h > 0.05
        for: 3h
        labels:
          severity: warning
          service: donation-service
          slo: latency
        annotations:
          summary: "donation-service queimando error budget de latency (1x)"
          description: "10% do error budget mensal consumido em 3 dias. Burn rate 1x sobre SLO 95%. Ratio 3d: {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/solidarytech-fiap/solidarytech-app/blob/main/docs/runbooks/donation-slo-burn.md
