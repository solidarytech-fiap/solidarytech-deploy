# Secret do Datadog (API key) a partir do SSM, consumido pelo OTel Collector.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/solidarytech-fiap/solidarytech-deploy.git
    targetRevision: main
    path: k8s/observability-datadog
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
