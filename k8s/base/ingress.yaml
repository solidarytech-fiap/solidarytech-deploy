# Rotas publicas (ingress-nginx -> Load Balancer da AWS):
#   /ngo/*        -> ngo-service       (ex: /ngo/ngos)
#   /donation/*   -> donation-service  (ex: /donation/donations)
#   /volunteer/*  -> volunteer-service (ex: /volunteer/volunteers/1)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solidarytech
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Protecao basica contra abuso nos picos de acesso.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ngo(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ngo-service
                port: { number: 8081 }
          - path: /donation(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: donation-service
                port: { number: 8082 }
          - path: /volunteer(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: volunteer-service
                port: { number: 8083 }
