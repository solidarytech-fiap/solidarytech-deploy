# Segredos/config vindos do SSM Parameter Store (criados pelo Terraform).
# Nenhum valor sensivel no Git. O External Secrets Operator mantem os
# Secrets do Kubernetes sincronizados (refreshInterval).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ngo-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target: { name: ngo-db }
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: /solidarytech/prod/ngo/db-connection, property: url } }
    - { secretKey: PGHOST, remoteRef: { key: /solidarytech/prod/ngo/db-connection, property: host } }
    - { secretKey: PGDATABASE, remoteRef: { key: /solidarytech/prod/ngo/db-connection, property: dbname } }
    - { secretKey: PGUSER, remoteRef: { key: /solidarytech/prod/ngo/db-connection, property: username } }
    - { secretKey: PGPASSWORD, remoteRef: { key: /solidarytech/prod/ngo/db-connection, property: password } }
---
