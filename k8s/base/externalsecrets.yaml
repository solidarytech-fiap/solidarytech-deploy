# JSON {AWS_REGION, AWS_SQS_URL, AWS_DYNAMODB_TABLE, AWS_DYNAMODB_NGO_INDEX}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target: { name: app-config }
  dataFrom:
    - extract: { key: /solidarytech/prod/config/app }
---
# JSON {BACKUP_BUCKET, BACKUP_REGION} - usado pelo CronJob de pg_dump (DR).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dr-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target: { name: dr-config }
  dataFrom:
    - extract: { key: /solidarytech/prod/config/dr }
